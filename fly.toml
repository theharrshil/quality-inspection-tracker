# Fly.io deployment config for the Quality Inspection Tracker.
# Single machine + one persistent volume for the SQLite database.
app = "quality-inspection-tracker"
primary_region = "sin"

[build]
  # Uses the repo Dockerfile as-is (node:24-trixie-slim, builds SPA, runs Hono).

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # SQLite file lives on the mounted volume (see [mounts] below).
  DATABASE_URL = "./data/app.sqlite"

# Persistent disk for the SQLite database, mounted at /app/data.
[mounts]
  source = "qit_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always running so there are no cold starts (no idle spin-down).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
