services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Override these in a real deploy. Defaults keep `docker compose up` working
      # out of the box for a reviewer.
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      SAP_WEBHOOK_SECRET: ${SAP_WEBHOOK_SECRET:-dev-sap-secret}
      SEED_USERNAME: ${SEED_USERNAME:-supervisor}
      SEED_PASSWORD: ${SEED_PASSWORD:-inspect123}
    volumes:
      # Persist the SQLite database across container restarts.
      - qit-data:/app/data

volumes:
  qit-data:
